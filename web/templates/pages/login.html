{{ define "content" }}
<section class="login-page">
  <div class="login-card">
    <p class="eyebrow">SEU ESTÚDIO PARTICULAR</p>
    <h1>Entrar<span class="heading-period">.</span></h1>
    <p class="login-subtitle">Traduza seus EPUBs capítulo a capítulo. As chaves e os livros ficam só aqui.</p>
    {{ if .Error }}<p class="notice notice-error" role="alert">{{ .Error }}</p>{{ end }}
    <form action="/login" method="post" class="login-form">
      {{ csrfField .CSRFToken }}
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required autofocus /></div>
      <div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
      <button class="button button-primary" type="submit">Entrar {{ template "icon_arrow" . }}</button>
    </form>
  </div>
</section>
{{ end }}
